<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="text-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accent-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".15"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".05"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(.98)}50%{opacity:.7;transform:scale(1.02)}}@keyframes float1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(2deg)}}@keyframes float2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(12px) rotate(-2deg)}}@keyframes flow{0%{stroke-dashoffset:100}}.bg-node{animation:pulse 6s infinite ease-in-out;transform-origin:center}.floating-card-1{animation:float1 5s infinite ease-in-out}.floating-card-2{animation:float2 7s infinite ease-in-out}.flowing-line{stroke-dasharray:10 15;animation:flow 20s linear infinite}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:44px;fill:url(#text-gradient)}.subtitle{font-weight:500;font-size:18px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}</style><rect width="1200" height="300" fill="url(#bg-gradient)" rx="16"/><path stroke="#334155" stroke-opacity=".2" stroke-width="1" d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200"/><path stroke="#334155" stroke-opacity=".2" stroke-width="1" d="M200 0 V300 M400 0 V300 M600 0 V300 M800 0 V300 M1000 0 V300"/><g class="bg-node" opacity=".4"><circle cx="150" cy="150" r="120" fill="url(#accent-glow)" filter="url(#glow)"/><circle cx="1050" cy="150" r="140" fill="url(#accent-glow)" filter="url(#glow)"/></g><path fill="none" stroke="#38bdf8" stroke-opacity=".3" stroke-width="2" d="M 100 80 Q 300 220 600 150 T 1100 220" class="flowing-line"/><path fill="none" stroke="#818cf8" stroke-opacity=".3" stroke-width="2" d="M 50 220 Q 400 50 700 180 T 1150 90" class="flowing-line"/><g class="floating-card-1"><rect width="130" height="36" x="75" y="60" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.5" rx="18"/><circle cx="95" cy="78" r="6" fill="#38bdf8"/><text x="110" y="83" class="badge-text">📊 Curation</text><rect width="140" height="36" x="980" y="190" fill="#1e293b" stroke="#c084fc" stroke-opacity=".4" stroke-width="1.5" rx="18"/><circle cx="1000" cy="208" r="6" fill="#c084fc"/><text x="1015" y="213" class="badge-text">⚡ MLOps</text></g><g class="floating-card-2"><rect width="150" height="36" x="950" y="70" fill="#1e293b" stroke="#818cf8" stroke-opacity=".4" stroke-width="1.5" rx="18"/><circle cx="970" cy="88" r="6" fill="#818cf8"/><text x="985" y="93" class="badge-text">🏷️ Labeling</text><rect width="140" height="36" x="80" y="200" fill="#1e293b" stroke="#34d399" stroke-opacity=".4" stroke-width="1.5" rx="18"/><circle cx="100" cy="218" r="6" fill="#34d399"/><text x="115" y="223" class="badge-text">🔄 Versioning</text></g><g text-anchor="middle"><text x="600" y="125" class="title" filter="url(#glow)">Awesome Dataset Management Platform</text><text x="600" y="170" class="subtitle">Curated Ecosystem for Data Curation, Versioning, Visualization &amp; Error Analysis</text><g transform="translate(380, 205)"><rect width="120" height="28" x="0" y="0" fill="#334155" fill-opacity=".6" rx="14"/><text x="60" y="18" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">SaaS &amp; OSS</text><rect width="150" height="28" x="130" y="0" fill="#334155" fill-opacity=".6" rx="14"/><text x="205" y="18" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Data-Centric AI</text><rect width="150" height="28" x="290" y="0" fill="#334155" fill-opacity=".6" rx="14"/><text x="365" y="18" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Production Ready</text></g></g></svg>