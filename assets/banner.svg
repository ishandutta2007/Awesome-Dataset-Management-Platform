<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes flow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .bg-node { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .floating-card-1 { animation: float1 5s infinite ease-in-out; }
    .floating-card-2 { animation: float2 7s infinite ease-in-out; }
    .flowing-line { stroke-dasharray: 10 15; animation: flow 20s linear infinite; }
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: url(#text-gradient); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-gradient)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>
  <path d="M200 0 V300 M400 0 V300 M600 0 V300 M800 0 V300 M1000 0 V300" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Dynamic / Animated Background Graphics (Behind text) -->
  <g class="bg-node" opacity="0.4">
    <circle cx="150" cy="150" r="120" fill="url(#accent-glow)" filter="url(#glow)"/>
    <circle cx="1050" cy="150" r="140" fill="url(#accent-glow)" filter="url(#glow)"/>
  </g>

  <!-- Dynamic Connecting Network Lines (Background) -->
  <path class="flowing-line" d="M 100 80 Q 300 220 600 150 T 1100 220" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  <path class="flowing-line" d="M 50 220 Q 400 50 700 180 T 1150 90" stroke="#818cf8" stroke-opacity="0.3" stroke-width="2" fill="none"/>

  <!-- Decorative Floating Pills / Nodes on sides -->
  <g class="floating-card-1">
    <rect x="75" y="60" width="130" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="95" cy="78" r="6" fill="#38bdf8"/>
    <text x="110" y="83" class="badge-text">📊 Curation</text>

    <rect x="980" y="190" width="140" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="1000" cy="208" r="6" fill="#c084fc"/>
    <text x="1015" y="213" class="badge-text">⚡ MLOps</text>
  </g>

  <g class="floating-card-2">
    <rect x="950" y="70" width="150" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="970" cy="88" r="6" fill="#818cf8"/>
    <text x="985" y="93" class="badge-text">🏷️ Labeling</text>

    <rect x="80" y="200" width="140" height="36" rx="18" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="100" cy="218" r="6" fill="#34d399"/>
    <text x="115" y="223" class="badge-text">🔄 Versioning</text>
  </g>

  <!-- Foreground Main Title & Subtitle (Always crisp & visible on top) -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="125" class="title" filter="url(#glow)">Awesome Dataset Management Platform</text>
    
    <!-- Subtitle -->
    <text x="600" y="170" class="subtitle">Curated Ecosystem for Data Curation, Versioning, Visualization &amp; Error Analysis</text>
    
    <!-- Category Tags -->
    <g transform="translate(380, 205)">
      <rect x="0" y="0" width="120" height="28" rx="14" fill="#334155" fill-opacity="0.6"/>
      <text x="60" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">SaaS &amp; OSS</text>
      
      <rect x="130" y="0" width="150" height="28" rx="14" fill="#334155" fill-opacity="0.6"/>
      <text x="205" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">Data-Centric AI</text>
      
      <rect x="290" y="0" width="150" height="28" rx="14" fill="#334155" fill-opacity="0.6"/>
      <text x="365" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">Production Ready</text>
    </g>
  </g>
</svg>
